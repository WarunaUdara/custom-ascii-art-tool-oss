<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#000000"/>
  
  <!-- Subtle Grid Lines -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#141418" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)" />
  
  <!-- Outer Card Frame -->
  <rect x="80" y="60" width="1040" height="510" fill="#09090c" stroke="#22222a" stroke-width="1.5" rx="8"/>
  
  <!-- Corner Crosshairs -->
  <text x="88" y="80" fill="#ff5b35" font-family="monospace" font-size="18">+</text>
  <text x="1100" y="80" fill="#ff5b35" font-family="monospace" font-size="18">+</text>
  <text x="88" y="555" fill="#ff5b35" font-family="monospace" font-size="18">+</text>
  <text x="1100" y="555" fill="#ff5b35" font-family="monospace" font-size="18">+</text>
  
  <!-- Header Tag -->
  <rect x="120" y="110" width="190" height="32" fill="#18181f" stroke="#2c2c38" rx="4"/>
  <text x="135" y="131" fill="#ff5b35" font-family="monospace" font-size="13" font-weight="bold" letter-spacing="1">SYSTEM V2.0 // OSS</text>
  
  <!-- Main Title -->
  <text x="120" y="220" fill="#ffffff" font-family="monospace, sans-serif" font-size="54" font-weight="900" letter-spacing="-1">ASCII &amp; DITHER</text>
  <text x="120" y="280" fill="#ff5b35" font-family="monospace, sans-serif" font-size="54" font-weight="900" letter-spacing="-1">STUDIO ENGINE</text>
  
  <!-- Description -->
  <text x="120" y="345" fill="#a1a1aa" font-family="sans-serif" font-size="20" font-weight="400">
    Real-time retro matrix, 7-level quantization, Floyd-Steinberg &amp; Bayer dithering.
  </text>
  <text x="120" y="380" fill="#71717a" font-family="sans-serif" font-size="18">
    60 FPS hardware-accelerated WebM/MP4 video frame processing engine.
  </text>
  
  <!-- Footer Metadata Tags -->
  <rect x="120" y="450" width="130" height="36" fill="#121216" stroke="#27272f" rx="4"/>
  <text x="142" y="473" fill="#ededed" font-family="monospace" font-size="13">SVELTE 5</text>
  
  <rect x="265" y="450" width="120" height="36" fill="#121216" stroke="#27272f" rx="4"/>
  <text x="290" y="473" fill="#ededed" font-family="monospace" font-size="13">ASTRO JS</text>
  
  <rect x="400" y="450" width="140" height="36" fill="#121216" stroke="#27272f" rx="4"/>
  <text x="420" y="473" fill="#ededed" font-family="monospace" font-size="13">CANVAS 2D</text>

  <rect x="555" y="450" width="170" height="36" fill="#121216" stroke="#27272f" rx="4"/>
  <text x="575" y="473" fill="#ededed" font-family="monospace" font-size="13">GEIST PIXEL</text>
</svg>
