<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dither Filter Tool</title>
<style>
  :root{
    --bg: #0b0b0d;
    --panel: #141417;
    --border: #26262b;
    --text: #e4e4e7;
    --sub: #8b8b93;
    --accent: #ff5b35;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg); color:var(--text);
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size:13px;
  }
  .app{ display:flex; height:100%; width:100%; }
  .panel{
    width:320px; min-width:320px;
    background:var(--panel);
    border-right:1px solid var(--border);
    padding:20px;
    overflow-y:auto;
  }
  .panel h1{
    font-size:13px; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--accent); margin-bottom:18px;
  }
  .panel h2{
    font-size:11px; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--sub); margin: 4px 0 12px;
  }
  .field{ margin-bottom:20px; }
  .field label{
    display:flex; justify-content:space-between;
    font-size:11px; color:var(--sub); text-transform:uppercase;
    letter-spacing:0.05em; margin-bottom:8px;
  }
  .field label span.val{ color:var(--text); }
  input[type="range"]{ width:100%; accent-color:var(--accent); }
  input[type="color"]{
    width:100%; height:30px; border:1px solid var(--border);
    background:none; border-radius:4px; cursor:pointer; padding:2px;
  }
  select, input[type="text"]{
    width:100%; background:#1c1c20; color:var(--text);
    border:1px solid var(--border); border-radius:4px; padding:7px 8px;
    font-family:inherit; font-size:12px;
  }
  .drop{
    border:1.5px dashed var(--border); border-radius:8px;
    padding:22px 12px; text-align:center; color:var(--sub);
    cursor:pointer; margin-bottom:20px; transition:border-color .2s;
  }
  .drop:hover, .drop.drag{ border-color:var(--accent); color:var(--text); }
  .drop input{ display:none; }
  .toggle-row{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:16px;
  }
  .toggle-row label{ font-size:11px; color:var(--sub); text-transform:uppercase; letter-spacing:.05em; }
  .switch{ position:relative; width:38px; height:20px; }
  .switch input{ opacity:0; width:0; height:0; }
  .slider-toggle{
    position:absolute; cursor:pointer; inset:0;
    background:#2a2a30; border-radius:999px; transition:.2s;
  }
  .slider-toggle:before{
    content:""; position:absolute; height:14px; width:14px;
    left:3px; top:3px; background:#888; border-radius:50%; transition:.2s;
  }
  input:checked + .slider-toggle{ background:var(--accent); }
  input:checked + .slider-toggle:before{ transform:translateX(18px); background:#fff; }

  .levels{ display:flex; flex-direction:column; gap:6px; margin-bottom:20px; }
  .level-row{ display:flex; align-items:center; gap:8px; }
  .level-row .lbl{ width:60px; font-size:10px; color:var(--sub); }
  .level-row input[type="color"]{ height:24px; flex:1; padding:1px; }

  button.primary{
    width:100%; background:var(--accent); color:#fff; border:none;
    padding:10px; border-radius:6px; font-family:inherit; font-size:12px;
    letter-spacing:.05em; text-transform:uppercase; cursor:pointer; font-weight:600;
    margin-top:4px;
  }
  button.primary:disabled{ opacity:.45; cursor:not-allowed; }

  #recordStatus{
    margin-top:10px; font-size:11px; color:var(--sub);
    min-height:15px; text-align:center;
  }
  #recordStatus.rec{ color:var(--accent); }

  .stage{
    flex:1; display:flex; align-items:center; justify-content:center;
    padding:30px; overflow:auto; position:relative;
  }
  .stage-empty{ color:var(--sub); text-align:center; font-size:12px; }
  canvas#output{
    max-width:100%; max-height:100%;
    box-shadow:0 20px 60px rgba(0,0,0,0.5);
    border-radius:2px;
    cursor:crosshair;
  }
  hr{ border:none; border-top:1px solid var(--border); margin:20px 0; }
</style>
</head>
<body>

<div class="app">
  <div class="panel">
    <h1>Dither Filter</h1>

    <div class="drop" id="drop">
      <div id="dropLabel">Click or drop an image / video</div>
      <input type="file" id="fileInput" accept="image/*,video/*" />
    </div>

    <div class="field">
      <label>Grid resolution <span class="val" id="resVal">80</span> cols</label>
      <input type="range" id="resolution" min="10" max="220" value="80" step="1" />
    </div>

    <div class="field">
      <label>Cell style</label>
      <select id="style">
        <option value="char">ASCII characters</option>
        <option value="block">Solid blocks</option>
        <option value="dot">Round dots</option>
      </select>
    </div>

    <div class="field" id="rampField">
      <label>Character ramp (shadow → highlight)</label>
      <input type="text" id="ramp" value=" .:-=+*#%@" maxlength="20" />
    </div>

    <div class="toggle-row">
      <label>Invert tonal mapping</label>
      <label class="switch">
        <input type="checkbox" id="invert" />
        <span class="slider-toggle"></span>
      </label>
    </div>

    <div class="field">
      <label>Background colour</label>
      <input type="color" id="bgColor" value="#0b0b0d" />
    </div>

    <hr/>

    <div class="field">
      <label>7 tonal levels — shadow → highlight</label>
      <div class="levels" id="levels"></div>
    </div>

    <hr/>

    <h2>Hover Interaction</h2>

    <div class="toggle-row">
      <label>Enable hover colour animation</label>
      <label class="switch">
        <input type="checkbox" id="hoverEnable" checked />
        <span class="slider-toggle"></span>
      </label>
    </div>

    <div class="field">
      <label>Hover colour</label>
      <input type="color" id="hoverColor" value="#ffffff" />
    </div>

    <div class="field">
      <label>Hover radius <span class="val" id="hoverRadiusVal">18</span>%</label>
      <input type="range" id="hoverRadius" min="2" max="60" value="18" step="1" />
    </div>

    <div class="field">
      <label>Hover intensity <span class="val" id="hoverIntensityVal">100</span>%</label>
      <input type="range" id="hoverIntensity" min="0" max="100" value="100" step="1" />
    </div>

    <div class="field">
      <label>Fade speed <span class="val" id="fadeSpeedVal">18</span></label>
      <input type="range" id="fadeSpeed" min="2" max="60" value="18" step="1" />
    </div>

    <hr/>

    <button class="primary" id="downloadBtn">Download PNG (static)</button>

    <div id="videoSection" style="display:none;">
      <hr/>
      <h2>Video</h2>
      <div class="field">
        <label>Output FPS <span class="val" id="fpsVal">30</span></label>
        <input type="range" id="fpsInput" min="15" max="60" value="30" step="1" />
      </div>
      <div class="field">
        <label>Playback speed <span class="val" id="speedVal">1.00x</span></label>
        <input type="range" id="playbackInput" min="0.25" max="2" value="1" step="0.05" />
      </div>
      <button class="primary" id="videoBtn" disabled>Render Video</button>
      <div id="recordStatus"></div>
    </div>
  </div>

  <div class="stage" id="stage">
    <div class="stage-empty" id="stageEmpty">No image loaded yet</div>
    <canvas id="output" style="display:none;"></canvas>
  </div>
</div>

<script>
/* ============================================================
   STATE
   ============================================================ */
let sourceImage = null;   // HTMLImageElement (image mode)
let sourceVideo = null;   // HTMLVideoElement (video mode)
let currentFileName = "output";
let sourceCanvas = document.createElement("canvas");
let sourceCtx = sourceCanvas.getContext("2d", { willReadFrequently:true });

const outputCanvas = document.getElementById("output");
const outputCtx = outputCanvas.getContext("2d");

const DEFAULT_LEVEL_COLORS = [
  "#1a0a06", "#3a1408", "#6b220c", "#a8330f",
  "#d9531c", "#f2823c", "#ffd39b"
];
let levelColors = [...DEFAULT_LEVEL_COLORS];

// cached grid (geometry + per-cell brightness/level)
let grid = null; // { cols, rows, cellW, cellH, brightness: Float32Array, level: Uint8Array }
let influence = null; // Float32Array, current animated hover blend per cell (0..1)

const thumb = document.createElement("canvas");
const thumbCtx = thumb.getContext("2d", { willReadFrequently:true });

let rafId = null;
let previewRaf = null;

// recording state
let rec = null;          // MediaRecorder
let recChunks = [];
let recEnded = false;    // true once video playback finished

/* ============================================================
   UI: level color rows
   ============================================================ */
const levelsWrap = document.getElementById("levels");
const labels = ["Shadow","Low","Mid-low","Mid","Mid-high","High","Highlight"];
labels.forEach((lab, i)=>{
  const row = document.createElement("div");
  row.className = "level-row";
  row.innerHTML = `
    <span class="lbl">${lab}</span>
    <input type="color" data-idx="${i}" value="${levelColors[i]}" />
  `;
  levelsWrap.appendChild(row);
});
levelsWrap.querySelectorAll('input[type="color"]').forEach(inp=>{
  inp.addEventListener("input", e=>{
    levelColors[+e.target.dataset.idx] = e.target.value;
    markDirty(false);
  });
});

/* ============================================================
   File loading (image or video)
   ============================================================ */
const drop = document.getElementById("drop");
const fileInput = document.getElementById("fileInput");
const dropLabel = document.getElementById("dropLabel");
const stageEmpty = document.getElementById("stageEmpty");
const videoSection = document.getElementById("videoSection");
const videoBtn = document.getElementById("videoBtn");
const recordStatus = document.getElementById("recordStatus");

drop.addEventListener("click", ()=>fileInput.click());
fileInput.addEventListener("change", e=>{
  if(e.target.files[0]) loadFile(e.target.files[0]);
});
["dragover","dragenter"].forEach(ev=>{
  drop.addEventListener(ev, e=>{ e.preventDefault(); drop.classList.add("drag"); });
});
["dragleave","drop"].forEach(ev=>{
  drop.addEventListener(ev, e=>{ e.preventDefault(); drop.classList.remove("drag"); });
});
drop.addEventListener("drop", e=>{
  const f = e.dataTransfer.files[0];
  if(f) loadFile(f);
});

function loadFile(file){
  stopRecording();
  cancelAnimationFrame(previewRaf);
  previewRaf = null;
  sourceVideo = null;

  currentFileName = (file.name || "output").replace(/\.[^.]+$/, "");
  const isVideo = (file.type || "").startsWith("video/") || /\.(mp4|webm|mov|mkv|avi|m4v)$/i.test(file.name);
  if(isVideo){
    loadVideo(file);
  } else {
    loadImage(file);
  }
}

function loadImage(file){
  const reader = new FileReader();
  reader.onload = ev=>{
    const img = new Image();
    img.onload = ()=>{
      sourceImage = img;
      sourceCanvas.width = img.width;
      sourceCanvas.height = img.height;
      sourceCtx.drawImage(img, 0, 0);
      dropLabel.textContent = file.name;
      stageEmpty.style.display = "none";
      outputCanvas.style.display = "block";
      videoSection.style.display = "none";
      markDirty(true);
      startLoop();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function loadVideo(file){
  const url = URL.createObjectURL(file);
  const video = document.createElement("video");
  video.src = url;
  video.muted = true;
  video.playsInline = true;
  video.loop = false;
  video.preload = "auto";
  video.onloadedmetadata = ()=>{
    if(!video.videoWidth) return;
    sourceCanvas.width = video.videoWidth;
    sourceCanvas.height = video.videoHeight;
    video.playbackRate = parseFloat(playbackInput.value);
    dropLabel.textContent = file.name;
    stageEmpty.style.display = "none";
    outputCanvas.style.display = "block";
    videoSection.style.display = "block";
    videoBtn.disabled = false;
    setRecordStatus("");
    ensureGrid(1);
    startPreviewLoop(video);
  };
  video.onended = ()=>{
    if(rec) stopRecording(true);
  };
  video.onerror = ()=>{
    dropLabel.textContent = "Failed to load video";
    URL.revokeObjectURL(url);
  };
  sourceVideo = video;
}

function startPreviewLoop(video){
  cancelAnimationFrame(previewRaf);
  const step = ()=>{
    refreshFromVideo(video);
    previewRaf = requestAnimationFrame(step);
  };
  previewRaf = requestAnimationFrame(step);
}

/* ============================================================
   Controls
   ============================================================ */
const resolutionInput = document.getElementById("resolution");
const resVal = document.getElementById("resVal");
const styleSelect = document.getElementById("style");
const rampInput = document.getElementById("ramp");
const rampField = document.getElementById("rampField");
const invertInput = document.getElementById("invert");
const bgColorInput = document.getElementById("bgColor");

const hoverEnable = document.getElementById("hoverEnable");
const hoverColorInput = document.getElementById("hoverColor");
const hoverRadiusInput = document.getElementById("hoverRadius");
const hoverRadiusVal = document.getElementById("hoverRadiusVal");
const hoverIntensityInput = document.getElementById("hoverIntensity");
const hoverIntensityVal = document.getElementById("hoverIntensityVal");
const fadeSpeedInput = document.getElementById("fadeSpeed");
const fadeSpeedVal = document.getElementById("fadeSpeedVal");

const fpsInput = document.getElementById("fpsInput");
const fpsVal = document.getElementById("fpsVal");
const playbackInput = document.getElementById("playbackInput");
const speedVal = document.getElementById("speedVal");

resolutionInput.addEventListener("input", ()=>{
  resVal.textContent = resolutionInput.value;
  markDirty(true);
});
styleSelect.addEventListener("change", ()=>{
  rampField.style.display = styleSelect.value === "char" ? "block" : "none";
  markDirty(false);
});
rampInput.addEventListener("input", ()=>markDirty(false));
invertInput.addEventListener("change", ()=>markDirty(true));
bgColorInput.addEventListener("input", ()=>markDirty(false));

hoverRadiusInput.addEventListener("input", ()=>{
  hoverRadiusVal.textContent = hoverRadiusInput.value;
});
hoverIntensityInput.addEventListener("input", ()=>{
  hoverIntensityVal.textContent = hoverIntensityInput.value;
});
fadeSpeedInput.addEventListener("input", ()=>{
  fadeSpeedVal.textContent = fadeSpeedInput.value;
});

fpsInput.addEventListener("input", ()=>{
  fpsVal.textContent = fpsInput.value;
});
playbackInput.addEventListener("input", ()=>{
  speedVal.textContent = parseFloat(playbackInput.value).toFixed(2) + "x";
  if(sourceVideo) sourceVideo.playbackRate = parseFloat(playbackInput.value);
});

let needsRecompute = true;
function markDirty(recompute){
  needsRecompute = needsRecompute || recompute;
  if(!hoverEnable.checked && sourceImage){
    // static mode: recompute once immediately so non-animated edits show up
    computeGridIfNeeded();
    draw();
  }
  if(sourceVideo && !rec){
    // video mode: rebuild geometry immediately (brightness refreshes per frame)
    ensureGrid(recompute);
  }
}

/* ============================================================
   Mouse tracking (in output canvas's internal pixel space)
   ============================================================ */
outputCanvas.addEventListener("mousemove", e=>{
  const rect = outputCanvas.getBoundingClientRect();
  const scaleX = outputCanvas.width / rect.width;
  const scaleY = outputCanvas.height / rect.height;
  mouse = {
    x: (e.clientX - rect.left) * scaleX,
    y: (e.clientY - rect.top) * scaleY
  };
});
outputCanvas.addEventListener("mouseleave", ()=>{ mouse = null; });

// mouse position in OUTPUT-CANVAS internal pixel space, or null when not hovering
let mouse = null;

/* ============================================================
   Grid geometry + brightness sampling
   ============================================================ */
function currentAspect(){
  return sourceImage
    ? sourceImage.width / sourceImage.height
    : sourceCanvas.width / sourceCanvas.height;
}

// (re)create grid arrays + output canvas when geometry changes
function ensureGrid(force){
  const cols = parseInt(resolutionInput.value, 10);
  const aspect = currentAspect();
  const rows = Math.max(1, Math.round(cols / aspect));

  if(grid && !force && grid.cols === cols && grid.rows === rows) return grid;

  const targetW = 1000;
  const targetH = Math.round(targetW / aspect);
  if(outputCanvas.width !== targetW || outputCanvas.height !== targetH){
    outputCanvas.width = targetW;
    outputCanvas.height = targetH;
  }

  const cellW = targetW / cols;
  const cellH = targetH / rows;

  const brightness = new Float32Array(cols * rows);
  const level = new Uint8Array(cols * rows);
  grid = { cols, rows, cellW, cellH, brightness, level };

  influence = new Float32Array(cols * rows);
  thumb.width = cols;
  thumb.height = rows;
  return grid;
}

// read current sourceCanvas, recompute per-cell brightness and quantized level
function refreshBrightness(){
  if(!grid) return;
  const { cols, rows, brightness, level } = grid;
  thumbCtx.drawImage(sourceCanvas, 0, 0, cols, rows);
  const data = thumbCtx.getImageData(0, 0, cols, rows).data;
  const invert = invertInput.checked;
  for(let i=0, p=0; i<brightness.length; i++, p+=4){
    let b = (data[p]*0.299 + data[p+1]*0.587 + data[p+2]*0.114) / 255;
    if(invert) b = 1 - b;
    brightness[i] = b;
    level[i] = Math.min(6, Math.floor(b * 7));
  }
}

// image-mode entry point (recompute only when dirty)
function computeGridIfNeeded(){
  if(!sourceImage || !needsRecompute) return;
  needsRecompute = false;
  ensureGrid(true);
  refreshBrightness();
}

function refreshFromVideo(video){
  if(!grid || !video) return;
  if(video.readyState < 2) return;
  sourceCtx.drawImage(video, 0, 0, sourceCanvas.width, sourceCanvas.height);
  refreshBrightness();
  draw();
}

/* ============================================================
   Color blend helper
   ============================================================ */
function hexToRgb(hex){
  const v = parseInt(hex.slice(1), 16);
  return [(v>>16)&255, (v>>8)&255, v&255];
}
function lerpColor(rgbA, rgbB, t){
  return [
    Math.round(rgbA[0] + (rgbB[0]-rgbA[0])*t),
    Math.round(rgbA[1] + (rgbB[1]-rgbA[1])*t),
    Math.round(rgbA[2] + (rgbB[2]-rgbA[2])*t)
  ];
}

/* ============================================================
   Draw (uses cached grid + current influence array)
   ============================================================ */
function draw(){
  if(!grid) return;
  const { cols, rows, cellW, cellH, level } = grid;
  const style = styleSelect.value;
  const ramp = rampInput.value.length ? rampInput.value : " .:-=+*#%@";
  const hoverRgb = hexToRgb(hoverColorInput.value);
  const levelRgb = levelColors.map(hexToRgb);

  outputCtx.fillStyle = bgColorInput.value;
  outputCtx.fillRect(0, 0, outputCanvas.width, outputCanvas.height);

  outputCtx.textAlign = "center";
  outputCtx.textBaseline = "middle";
  const fontSize = Math.max(6, Math.min(cellW, cellH) * 1.05);
  outputCtx.font = `${fontSize}px ui-monospace, SFMono-Regular, Menlo, Monaco, monospace`;

  for(let r=0; r<rows; r++){
    for(let c=0; c<cols; c++){
      const idx = r*cols + c;
      const lvl = level[idx];
      const inf = influence ? influence[idx] : 0;
      const base = levelRgb[lvl];
      const rgb = inf > 0.001 ? lerpColor(base, hoverRgb, inf) : base;
      const color = `rgb(${rgb[0]},${rgb[1]},${rgb[2]})`;

      const cx = c*cellW + cellW/2;
      const cy = r*cellH + cellH/2;

      if(style === "block"){
        outputCtx.fillStyle = color;
        outputCtx.fillRect(c*cellW, r*cellH, Math.ceil(cellW), Math.ceil(cellH));
      } else if(style === "dot"){
        const radius = (Math.min(cellW, cellH) / 2) * (0.25 + (lvl/6) * 0.75);
        outputCtx.fillStyle = color;
        outputCtx.beginPath();
        outputCtx.arc(cx, cy, radius, 0, Math.PI*2);
        outputCtx.fill();
      } else {
        const rampIdx = Math.min(ramp.length-1, Math.round((lvl/6) * (ramp.length-1)));
        const ch = ramp[rampIdx];
        if(ch !== " "){
          outputCtx.fillStyle = color;
          outputCtx.fillText(ch, cx, cy);
        }
      }
    }
  }
}

/* ============================================================
   Animation loop (image mode) — per-cell hover influence
   eased each frame toward target (1 inside radius, else 0).
   ============================================================ */
function updateInfluence(){
  if(!grid || !influence) return;
  const { cols, rows, cellW, cellH } = grid;
  const radiusPx = (parseInt(hoverRadiusInput.value,10)/100) * outputCanvas.width;
  const intensity = parseInt(hoverIntensityInput.value,10)/100;
  const speed = parseInt(fadeSpeedInput.value,10)/100; // easing factor per frame

  for(let r=0; r<rows; r++){
    for(let c=0; c<cols; c++){
      const idx = r*cols + c;
      let target = 0;
      if(mouse){
        const cx = c*cellW + cellW/2;
        const cy = r*cellH + cellH/2;
        const dist = Math.hypot(cx-mouse.x, cy-mouse.y);
        const t = 1 - Math.min(1, dist / radiusPx); // 1 at center, 0 at edge
        target = Math.max(0, t) * intensity;
      }
      influence[idx] += (target - influence[idx]) * speed;
      if(Math.abs(influence[idx]) < 0.001) influence[idx] = 0;
    }
  }
}

function loop(){
  computeGridIfNeeded();
  if(hoverEnable.checked){
    updateInfluence();
  }
  draw();
  rafId = requestAnimationFrame(loop);
}
function startLoop(){
  if(rafId) cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(loop);
}

/* ============================================================
   Download (exports current static frame, hover blend cleared)
   ============================================================ */
document.getElementById("downloadBtn").addEventListener("click", ()=>{
  if(!sourceImage && !sourceVideo) return;
  const prevMouse = mouse;
  mouse = null;
  if(influence) influence.fill(0);
  draw();
  const link = document.createElement("a");
  link.download = currentFileName + "-dithered.png";
  link.href = outputCanvas.toDataURL("image/png");
  link.click();
  mouse = prevMouse;
});

/* ============================================================
   Video export (canvas.captureStream + MediaRecorder)
   Produces MP4 (Safari) or WebM (Chrome/Firefox), both uploadable.
   ============================================================ */
function pickMime(){
  const candidates = [
    "video/mp4;codecs=avc1.42E01E,mp4a.40.2",
    "video/mp4",
    "video/webm;codecs=vp9",
    "video/webm;codecs=vp8",
    "video/webm"
  ];
  for(const t of candidates){
    if(MediaRecorder.isTypeSupported(t)) return t;
  }
  return "";
}

function setRecordStatus(text, rec = false){
  recordStatus.textContent = text;
  recordStatus.classList.toggle("rec", rec);
}

async function startRecording(){
  if(!sourceVideo) return;
  const fps = parseInt(fpsInput.value, 10);
  const mime = pickMime();
  if(!mime){
    setRecordStatus("MediaRecorder unsupported in this browser");
    return;
  }
  const stream = outputCanvas.captureStream(fps);
  recChunks = [];
  recEnded = false;

  try {
    rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 8_000_000 });
  } catch(err){
    rec = null;
    setRecordStatus("Could not start recorder");
    return;
  }

  rec.ondataavailable = e=>{ if(e.data && e.data.size) recChunks.push(e.data); };
  rec.onstop = ()=>{
    const blobType = rec.mimeType.includes("mp4") ? "video/mp4" : "video/webm";
    const blob = new Blob(recChunks, { type: blobType });
    const ext = rec.mimeType.includes("mp4") ? "mp4" : "webm";
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = currentFileName + "-dithered." + ext;
    link.click();
    setTimeout(()=>URL.revokeObjectURL(link.href), 1000);
    setRecordStatus("Saved " + ext.toUpperCase());
    finishRecordingUI();
  };

  rec.start(250);
  videoBtn.textContent = "Stop & Download";
  cancelAnimationFrame(previewRaf);
  if(recChunks.length) recChunks.length = 0;
  if(influence) influence.fill(0);
  try {
    sourceVideo.currentTime = 0;
    await sourceVideo.play();
  } catch(_){
    // autoplay muted should always succeed
  }
  startRecordingLoop();
}

function startRecordingLoop(){
  const step = ()=>{
    if(!rec) return;
    let pos = 0, dur = 0;
    if(sourceVideo){
      pos = sourceVideo.currentTime || 0;
      dur = isFinite(sourceVideo.duration) ? sourceVideo.duration : 0;
    }
    setRecordStatus("Recording " + pos.toFixed(1) + "s / " + (dur ? dur.toFixed(1) + "s" : "…"), true);
    refreshFromVideo(sourceVideo);
    rafId = requestAnimationFrame(step);
  };
  rafId = requestAnimationFrame(step);
}

function stopRecording(byEnded){
  recEnded = true;
  if(rec && rec.state !== "inactive"){
    rec.stop();
  } else {
    finishRecordingUI();
  }
}

function finishRecordingUI(){
  if(rec){
    rec = null;
    recChunks = [];
  }
  videoBtn.textContent = "Render Video";
  if(sourceVideo){
    sourceVideo.pause();
    // return to preview on next RAF frame
    startPreviewLoop(sourceVideo);
  }
}

function stopRecordingSilent(){
  // tear down without the "Saved" message (used when a new file is loaded)
  if(rec && rec.state !== "inactive"){
    rec.onstop = null;
    try { rec.stop(); } catch(_){}
  }
  rec = null;
  recChunks = [];
  videoBtn.textContent = "Render Video";
  setRecordStatus("");
}

videoBtn.addEventListener("click", ()=>{
  if(!sourceVideo) return;
  if(rec){
    stopRecording(false);
  } else {
    startRecording();
  }
});

rampField.style.display = styleSelect.value === "char" ? "block" : "none";
</script>
</body>
